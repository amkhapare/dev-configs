## PLUGINS ##
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'


## TMUX CONFIGS ##
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-window-option -g mode-keys vi
set-option -g renumber-windows on

set -as terminal-features ",xterm*:RGB:extkeys"
set-option -g status-interval 5
set-option -g automatic-rename off


set -g @catppuccin_window_default_text "#{b:window_name}" # use "#W" for application instead of directory
set -g @catppuccin_pane_default_text "#{b:window_name}"


bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Allow mouse scroll
set -g mouse on

# Scroll History
set -g history-limit 30000

# Remove escape delay for Neovim responsiveness
set -s escape-time 0

set -g extended-keys always

# Copy to the macOS clipboard and keep mouse selections highlighted.
set -s copy-command '/usr/bin/pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection \; send-keys -X copy-pipe-no-clear
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

## SHOULD BE THE LAST LINE ##
run '~/.tmux/plugins/tpm/tpm'
